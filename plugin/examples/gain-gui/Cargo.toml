[package]
name = "clack-plugin-gain-gui"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
clack-plugin = { workspace = true }
clack-extensions = { workspace = true, features = [
    "audio-ports",
    "clack-plugin",
    "gui",
    "note-ports",
    "params",
    "raw-window-handle_05",
    "state",
] }

baseview = { version = "0.2.2" }
egui-baseview = { version = "0.6.0" }
egui = "0.35.0"

[dev-dependencies]
clack-host = { workspace = true, features = ["clack-plugin"] }
clack-extensions = { workspace = true, features = [
    "audio-ports",
    "params",
    "state",
    "clack-plugin",
    "clack-host",
] }
